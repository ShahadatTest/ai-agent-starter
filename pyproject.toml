[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter"
version = "0.1.0"
description = "A small, tested starter for document-grounded Claude agents (RAG + tool use)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Esdras Souza (Thalzeron Labs)" }]
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-starter = "agent_starter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
